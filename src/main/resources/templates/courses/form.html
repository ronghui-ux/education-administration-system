<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>课程表单</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container mt-4">
<h2 th:text="${course != null && course.courseId != null ? '编辑课程' : '新增课程'}">课程表单</h2>

<form th:object="${course}" th:action="@{/courses}" method="post">
  <!-- 上面内容保持不变 -->

  <div class="mb-3">
    <label class="form-label">教师</label>
    <select th:field="*{teacherId}" class="form-select">
      <option value="" th:text="'未指定'"></option>
      <!-- 方案A：用字面量替换 + 半角括号 -->
      <option th:each="t : ${staffs}" th:value="${t.staffId}" th:text="|${t.name} (${t.staffId})|"></option>

      <!-- 方案B（备选）：用字符串拼接 + 半角括号
      <option th:each="t : ${staffs}" th:value="${t.staffId}"
              th:text="${t.name} + ' (' + ${t.staffId} + ')'"></option>
      -->
    </select>
    <div class="form-text">可选择教师或留空。</div>
  </div>

  <!-- 下面内容保持不变 -->
  <div class="row g-3">
    <div class="col-md-4">
      <label class="form-label">学时</label>
      <input th:field="*{hours}" type="number" min="0" class="form-control"
             th:classappend="${#fields.hasErrors('hours')} ? ' is-invalid' : ''"/>
      <div class="invalid-feedback" th:if="${#fields.hasErrors('hours')}" th:errors="*{hours}"></div>
    </div>
    <div class="col-md-4">
      <label class="form-label">学分</label>
      <input th:field="*{credits}" type="number" step="0.01" min="0" class="form-control"/>
    </div>
    <div class="col-md-4">
      <label class="form-label">考试时间</label>
      <input th:field="*{examTime}" type="datetime-local" class="form-control"/>
      <div class="form-text">格式：YYYY-MM-DDTHH:mm，例如 2026-01-01T09:00</div>
    </div>
  </div>

  <div class="row g-3 mt-1">
    <div class="col-md-6">
      <label class="form-label">上课时间</label>
      <input th:field="*{schedule}" class="form-control"/>
    </div>
    <div class="col-md-6">
      <label class="form-label">地点</label>
      <input th:field="*{location}" class="form-control"/>
    </div>
  </div>

  <div class="mt-3">
    <button type="submit" class="btn btn-primary">保存</button>
    <a th:href="@{/courses}" class="btn btn-secondary">取消</a>
  </div>
</form>
</body>
</html>
