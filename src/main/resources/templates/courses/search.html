<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>课程查询（课程号/课程名/教师姓名）</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container mt-4">
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>课程查询（按课程号/课程名/教师姓名）</h2>
    <div class="d-flex">
        <a th:href="@{/courses/search}" class="btn btn-outline-secondary">清空</a>
        <a th:href="@{/enroll/browse}" class="btn btn-outline-primary ms-2">前往选课</a>
        <!-- 新增：导出登记表 CSV（携带当前筛选参数） -->
        <a class="btn btn-success ms-2"
           th:href="@{/reports/registration.csv(
                     courseId=${courseId},
                     courseName=${name},
                     teacher=${teacher}
                   )}">
            导出登记表 CSV
        </a>
        <!-- 新增：导出成绩报表 CSV（携带当前筛选参数） -->
        <a class="btn btn-warning ms-2"
           th:href="@{/reports/grades.csv(
                     courseId=${courseId},
                     courseName=${name},
                     teacherName=${teacher}
                   )}">
            导出成绩报表 CSV
        </a>
    </div>
</div>

<form class="row g-3 mb-3" method="get" th:action="@{/courses/search}">
    <div class="col-md-3">
        <label class="form-label">课程号</label>
        <input name="courseId" th:value="${courseId}" class="form-control" placeholder="C001"/>
    </div>
    <div class="col-md-3">
        <label class="form-label">课程名</label>
        <input name="name" th:value="${name}" class="form-control" placeholder="数据库系统"/>
    </div>
    <div class="col-md-3">
        <label class="form-label">教师姓名</label>
        <input name="teacher" th:value="${teacher}" class="form-control" placeholder="张老师"/>
    </div>
    <div class="col-md-3 d-flex align-items-end">
        <button type="submit" class="btn btn-primary">查询</button>
    </div>
</form>

<div class="mb-2">
    <span class="text-muted">共 <strong th:text="${resultCount}">0</strong> 条结果</span>
</div>

<table class="table table-bordered table-hover">
    <thead class="table-light">
    <tr>
        <th>课程号</th>
        <th>课程名</th>
        <th>教师号</th>
        <th>教师姓名</th>
        <th>学时</th>
        <th>学分</th>
        <th>上课时间</th>
        <th>地点</th>
        <th>考试时间</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c : ${courses}">
        <td th:text="${c.courseId}">C001</td>
        <td th:text="${c.name}">数据库系统</td>
        <td th:text="${c.teacherId}">T1001</td>
        <!-- 安全获取教师姓名（为空或未映射时显示提示） -->
        <td th:text="${c.teacherId == null || c.teacherId == ''
                      ? '未指定'
                      : (teacherNameMap != null && teacherNameMap[c.teacherId] != null
                           ? teacherNameMap[c.teacherId]
                           : '未找到')}">教师姓名</td>
        <td th:text="${c.hours}">48</td>
        <td th:text="${c.credits}">3.0</td>
        <td th:text="${c.schedule}">周一 9:00</td>
        <td th:text="${c.location}">A101</td>
        <td th:text="${#temporals.format(c.examTime, 'yyyy-MM-dd HH:mm')}">2026-01-01 09:00</td>
    </tr>
    </tbody>
</table>
</body>
</html>
