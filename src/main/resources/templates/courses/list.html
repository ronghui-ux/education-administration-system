<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>课程管理（增删改 + 查询）</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container mt-4">
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>课程管理</h2>
    <div>
        <a th:href="@{/courses/new}" class="btn btn-primary">新增课程</a>
        <a th:href="@{/courses/search}" class="btn btn-outline-primary ms-2">高级查询页面</a>
    </div>
</div>

<form class="row g-3 mb-3" method="get" th:action="@{/courses}">
    <div class="col-md-3">
        <label class="form-label">课程号</label>
        <input name="courseId" th:value="${courseId}" class="form-control" placeholder="C001"/>
    </div>
    <div class="col-md-3">
        <label class="form-label">课程名</label>
        <input name="name" th:value="${name}" class="form-control" placeholder="数据库系统"/>
    </div>
    <div class="col-md-3">
        <label class="form-label">教师姓名</label>
        <input name="teacher" th:value="${teacher}" class="form-control" placeholder="张老师"/>
    </div>
    <div class="col-md-3 d-flex align-items-end">
        <button type="submit" class="btn btn-outline-secondary">搜索</button>
        <a th:href="@{/courses}" class="btn btn-outline-secondary ms-2">清空</a>
    </div>
</form>

<table class="table table-bordered table-hover">
    <thead class="table-light">
    <tr>
        <th>课程号</th>
        <th>课程名</th>
        <th>教师号</th>
        <th>教师姓名</th>
        <th>学时</th>
        <th>学分</th>
        <th>上课时间</th>
        <th>地点</th>
        <th>考试时间</th>
        <th style="width:180px;">操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c : ${courses}">
        <td th:text="${c.courseId}">C001</td>
        <td th:text="${c.name}">数据库系统</td>
        <td th:text="${c.teacherId}">T1001</td>
        <!-- 教师姓名：空值与键存在性保护 -->
        <td th:text="${c.teacherId == null || c.teacherId == ''
                      ? '未指定'
                      : (teacherNameMap != null && teacherNameMap[c.teacherId] != null
                           ? teacherNameMap[c.teacherId]
                           : '未找到')}">教师姓名</td>
        <td th:text="${c.hours}">48</td>
        <td th:text="${c.credits}">3.0</td>
        <td th:text="${c.schedule}">周一 9:00</td>
        <td th:text="${c.location}">A101</td>
        <td th:text="${#temporals.format(c.examTime, 'yyyy-MM-dd HH:mm')}">2026-01-01 09:00</td>
        <td>
            <a th:href="@{|/courses/${c.courseId}/edit|}" class="btn btn-sm btn-secondary">编辑</a>
            <form th:action="@{|/courses/${c.courseId}/delete|}" method="post" class="d-inline"
                  onsubmit="return confirm('确认删除该课程？');">
                <button type="submit" class="btn btn-sm btn-danger">删除</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
