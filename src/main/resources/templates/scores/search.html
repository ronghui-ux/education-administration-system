<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>成绩综合查询（分组与排序）</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container mt-4">
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>成绩综合查询（按课程分组，总评降序）</h2>
    <div class="d-flex">
        <a th:href="@{/scores/search}" class="btn btn-outline-secondary">清空</a>
        <!-- 新增：导出成绩报表 CSV（携带当前筛选参数） -->
        <a class="btn btn-warning ms-2"
           th:href="@{/reports/grades.csv(
                     term=${term},
                     courseId=${courseId},
                     courseName=${courseName},
                     teacherName=${teacherName},
                     deptId=${deptId}
                   )}">
            导出成绩报表 CSV
        </a>
    </div>
</div>

<form class="row g-3 mb-3" method="get" th:action="@{/scores/search}">
    <div class="col-md-3">
        <label class="form-label">学号</label>
        <input name="studentId" th:value="${studentId}" class="form-control" placeholder="S2023001"/>
    </div>
    <div class="col-md-3">
        <label class="form-label">学生姓名</label>
        <input name="studentName" th:value="${studentName}" class="form-control" placeholder="张三"/>
    </div>
    <div class="col-md-3">
        <label class="form-label">系号</label>
        <input name="deptId" th:value="${deptId}" class="form-control" placeholder="CS"/>
    </div>
    <div class="col-md-3">
        <label class="form-label">学期</label>
        <input name="term" th:value="${term}" class="form-control" placeholder="2025-2026-1"/>
    </div>

    <div class="col-md-3">
        <label class="form-label">课程号</label>
        <input name="courseId" th:value="${courseId}" class="form-control" placeholder="C001"/>
    </div>
    <div class="col-md-3">
        <label class="form-label">课程名称</label>
        <input name="courseName" th:value="${courseName}" class="form-control" placeholder="数据库系统"/>
    </div>
    <div class="col-md-3">
        <label class="form-label">教师姓名</label>
        <input name="teacherName" th:value="${teacherName}" class="form-control" placeholder="张老师"/>
    </div>
    <div class="col-md-3 d-flex align-items-end">
        <button type="submit" class="btn btn-primary">查询</button>
    </div>
</form>

<div class="mb-2">
    <span class="text-muted">共 <strong th:text="${totalCount}">0</strong> 条明细</span>
</div>

<div th:if="${#maps.size(grouped) == 0}">
    <div class="alert alert-warning">未找到符合条件的成绩记录。</div>
</div>

<div th:each="entry : ${grouped}">
    <div class="card mb-4">
        <div class="card-header">
            <strong>课程：</strong>
            <span th:text="${entry.key}">C001</span>
            <span class="text-muted ms-2">
          <span th:text="${#lists.isEmpty(entry.value) ? '' : entry.value[0].courseName}">数据库系统</span>
          （教师：<span th:text="${#lists.isEmpty(entry.value) ? '' : entry.value[0].teacherName}">张老师</span>）
          ，学期：
          <span th:text="${#lists.isEmpty(entry.value) ? '' : entry.value[0].term}">2025-2026-1</span>
        </span>
        </div>
        <div class="card-body p-0">
            <table class="table table-bordered table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th style="width:140px;">学号</th>
                    <th style="width:160px;">学生姓名</th>
                    <th style="width:120px;">系号</th>
                    <th style="width:140px;">平时成绩</th>
                    <th style="width:140px;">考试成绩</th>
                    <th style="width:180px;">总评成绩（降序）</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${entry.value}">
                    <td th:text="${r.studentId}">S2023001</td>
                    <td th:text="${r.studentName}">张三</td>
                    <td th:text="${r.deptId}">CS</td>
                    <td th:text="${r.usualScore}">88.00</td>
                    <td th:text="${r.examScore}">92.00</td>
                    <td th:text="${r.totalScore}">90.40</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
