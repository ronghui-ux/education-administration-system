<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>成绩综合查询</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container mt-4">
<h2>成绩综合查询</h2>

<form class="row g-3 mb-3" method="get" th:action="@{/scores/search}">
    <div class="col-md-2">
        <label class="form-label">学号</label>
        <input class="form-control" name="studentId" th:value="${studentId}"/>
    </div>
    <div class="col-md-2">
        <label class="form-label">学生姓名</label>
        <input class="form-control" name="studentName" th:value="${studentName}"/>
    </div>
    <div class="col-md-2">
        <label class="form-label">系号</label>
        <input class="form-control" name="deptId" th:value="${deptId}"/>
    </div>
    <div class="col-md-2">
        <label class="form-label">课程号</label>
        <input class="form-control" name="courseId" th:value="${courseId}"/>
    </div>
    <div class="col-md-2">
        <label class="form-label">课程名称</label>
        <input class="form-control" name="courseName" th:value="${courseName}"/>
    </div>
    <div class="col-md-2">
        <label class="form-label">教师姓名</label>
        <input class="form-control" name="teacherName" th:value="${teacherName}"/>
    </div>
    <div class="col-md-2">
        <label class="form-label">学期</label>
        <input class="form-control" name="term" th:value="${term}"/>
    </div>
    <div class="col-12 d-flex align-items-end">
        <button class="btn btn-primary mt-2" type="submit">查询</button>
        <a th:href="@{/scores/search}" class="btn btn-outline-secondary mt-2 ms-2">清空</a>
    </div>
</form>

<div class="mb-2">
    <span class="text-muted">共 <strong th:text="${resultCount}">0</strong> 条记录</span>
</div>

<div th:if="${grouped != null}">
    <div th:each="entry : ${grouped}">
        <h5 class="mt-4">
            课程：<span th:text="${entry.key}">C001</span>
            - <span th:text="${#lists.isEmpty(entry.value) ? '' : entry.value.get(0).courseName}">课程名</span>
            - 任课教师：<span th:text="${#lists.isEmpty(entry.value) ? '' : entry.value.get(0).teacherName}">教师名</span>
        </h5>
        <table class="table table-bordered table-hover">
            <thead class="table-light">
            <tr>
                <th>学号</th>
                <th>学生姓名</th>
                <th>系号</th>
                <th>课程号</th>
                <th>课程名称</th>
                <th>教师姓名</th>
                <th>学期</th>
                <th>平时成绩</th>
                <th>考试成绩</th>
                <th>总评成绩</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${entry.value}">
                <td th:text="${r.studentId}">S2023001</td>
                <td th:text="${r.studentName}">张三</td>
                <td th:text="${r.deptId}">CS01</td>
                <td th:text="${r.courseId}">C001</td>
                <td th:text="${r.courseName}">数据库系统</td>
                <td th:text="${r.teacherName}">张老师</td>
                <td th:text="${r.term}">2025-2026-1</td>
                <td th:text="${r.usualScore}">88.00</td>
                <td th:text="${r.examScore}">90.00</td>
                <td th:text="${r.totalScore}">89.20</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
