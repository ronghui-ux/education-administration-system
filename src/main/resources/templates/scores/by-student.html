<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>按学生录入与查询成绩</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container mt-4">
<h2>按学生录入与查询成绩</h2>

<form class="row g-3 mb-3" method="get" th:action="@{/scores/by-student}">
    <div class="col-md-4">
        <label class="form-label">学号</label>
        <input name="studentId" th:value="${studentId}" class="form-control" placeholder="S2023001" required/>
    </div>
    <div class="col-md-4">
        <label class="form-label">学期</label>
        <input name="term" th:value="${term}" class="form-control" placeholder="2025-2026-1" required/>
    </div>
    <div class="col-md-4 d-flex align-items-end">
        <button type="submit" class="btn btn-primary">查询</button>
        <a th:href="@{/scores/by-student}" class="btn btn-secondary ms-2">清空</a>
    </div>
</form>

<div class="card mb-4">
    <div class="card-header">新增/修改成绩（该学生 + 学期）</div>
    <div class="card-body">
        <form method="post" th:action="@{/scores/by-student/save}">
            <input type="hidden" name="studentId" th:value="${studentId}"/>
            <input type="hidden" name="term" th:value="${term}"/>
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">课程号</label>
                    <input name="courseId" class="form-control" placeholder="C001" required/>
                </div>
                <div class="col-md-3">
                    <label class="form-label">平时成绩</label>
                    <input name="usualScore" type="number" step="0.01" min="0" max="100" class="form-control"/>
                </div>
                <div class="col-md-3">
                    <label class="form-label">考试成绩</label>
                    <input name="examScore" type="number" step="0.01" min="0" max="100" class="form-control"/>
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button type="submit" class="btn btn-success">保存</button>
                </div>
            </div>
        </form>
        <div class="form-text mt-2">总评 = 平时×0.40 + 考试×0.60（保存时自动计算）。</div>
    </div>
</div>

<!-- 统一结果变量：优先使用 scores，其次 results，再次 rows -->
<div th:with="list=${scores != null ? scores : (results != null ? results : rows)}"
     th:if="${studentId != null && studentId != ''}">

    <h5>查询结果：学号 <span th:text="${studentId}"></span>，学期 <span th:text="${term}"></span>
        <span class="ms-2 small text-muted" th:if="${list != null}">
            共 <strong th:text="${#lists.size(list)}">0</strong> 条
        </span>
    </h5>

    <!-- 无数据提示 -->
    <div th:if="${list == null or #lists.isEmpty(list)}" class="alert alert-warning mt-2">
        未找到成绩记录。
    </div>

    <!-- 有数据时显示表格 -->
    <div th:if="${list != null and !#lists.isEmpty(list)}" class="mt-2">
        <table class="table table-bordered table-hover">
            <thead class="table-light">
            <tr>
                <th>课程号</th>
                <th>平时成绩</th>
                <th>考试成绩</th>
                <th>总评成绩</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${list}">
                <td th:text="${s.id != null ? s.id.courseId : ''}">C001</td>
                <td th:text="${s.usualScore}">88.00</td>
                <td th:text="${s.examScore}">92.00</td>
                <td th:text="${s.totalScore}">90.40</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
