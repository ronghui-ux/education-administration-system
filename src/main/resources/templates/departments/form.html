<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>系信息表单</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container mt-4">
<h2 th:text="${department != null && department.deptId != null ? '编辑系信息' : '新增系'}">系信息表单</h2>
<form th:object="${department}" th:action="@{/departments}" method="post" class="row g-3">
    <div class="col-md-4">
        <label class="form-label">系号</label>
        <input th:field="*{deptId}" class="form-control" required/>
    </div>
    <div class="col-md-8">
        <label class="form-label">名称</label>
        <input th:field="*{name}" class="form-control" required/>
    </div>
    <div class="col-12">
        <label class="form-label">简介</label>
        <textarea th:field="*{intro}" class="form-control" rows="3"></textarea>
    </div>
    <div class="col-12">
        <button class="btn btn-primary" type="submit">保存</button>
        <a th:href="@{/departments}" class="btn btn-outline-secondary ms-2">返回</a>
    </div>
</form>
</body>
</html>
