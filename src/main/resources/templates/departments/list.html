<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>系信息列表</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container mt-4">
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>系信息列表</h2>
    <a th:href="@{/departments/new}" class="btn btn-primary">新增系</a>
</div>

<form class="row g-2 mb-3" method="get" th:action="@{/departments}">
    <div class="col-auto">
        <input name="q" th:value="${q}" class="form-control" placeholder="按系号/系名搜索"/>
    </div>
    <div class="col-auto">
        <button type="submit" class="btn btn-outline-secondary">搜索</button>
    </div>
    <div class="col-auto">
        <a th:href="@{/departments}" class="btn btn-outline-secondary">清空</a>
    </div>
</form>

<table class="table table-bordered table-hover">
    <thead class="table-light">
    <tr>
        <th>系号</th>
        <th>系名称</th>
        <th>简介</th>
        <th style="width:160px;">操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="d : ${departments}">
        <td th:text="${d.deptId}">CS</td>
        <td th:text="${d.name}">计算机科学系</td>
        <td th:text="${d.intro}">简介...</td>
        <td>
            <a th:href="@{|/departments/${d.deptId}/edit|}" class="btn btn-sm btn-secondary">编辑</a>
            <form th:action="@{|/departments/${d.deptId}/delete|}" method="post" class="d-inline"
                  onsubmit="return confirm('确认删除该系信息？');">
                <button type="submit" class="btn btn-sm btn-danger">删除</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
