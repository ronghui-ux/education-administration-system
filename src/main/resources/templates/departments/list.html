<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>系管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container mt-4">
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>系管理</h2>
    <a th:href="@{/departments/new}" class="btn btn-primary">新增系</a>
</div>

<form class="mb-3" method="get" th:action="@{/departments}">
    <div class="input-group">
        <input class="form-control" name="q" th:value="${q}" placeholder="按系号/名称搜索"/>
        <button class="btn btn-outline-secondary" type="submit">搜索</button>
        <a class="btn btn-outline-secondary" th:href="@{/departments}">清空</a>
    </div>
</form>

<table class="table table-bordered table-hover">
    <thead class="table-light">
    <tr>
        <th>系号</th><th>名称</th><th>简介</th><th style="width:160px;">操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="d : ${departments}">
        <td th:text="${d.deptId}">CS01</td>
        <td th:text="${d.name}">计算机学院</td>
        <td th:text="${d.intro}">简介</td>
        <td>
            <a class="btn btn-sm btn-primary" th:href="@{|/departments/${d.deptId}/edit|}">编辑</a>
            <form th:action="@{|/departments/${d.deptId}/delete|}" method="post" class="d-inline">
                <button class="btn btn-sm btn-outline-danger" onclick="return confirm('确认删除？')">删除</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
