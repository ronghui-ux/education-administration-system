<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>教职工信息表单</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container mt-4">
<h2 th:text="${staff != null && staff.staffId != null ? '编辑教职工' : '新增教职工'}">教职工信息表单</h2>

<!-- 关键：th:object 提供选择变量上下文 -->
<form th:object="${staff}" th:action="@{/staffs}" method="post">
  <div class="mb-3">
    <label class="form-label">职工号</label>
    <input th:field="*{staffId}" class="form-control"
           th:readonly="${staff != null && staff.staffId != null}" required
           th:classappend="${#fields.hasErrors('staffId')} ? ' is-invalid' : ''"/>
    <div class="invalid-feedback" th:if="${#fields.hasErrors('staffId')}" th:errors="*{staffId}"></div>
  </div>

  <div class="mb-3">
    <label class="form-label">姓名</label>
    <input th:field="*{name}" class="form-control" required
           th:classappend="${#fields.hasErrors('name')} ? ' is-invalid' : ''"/>
    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
  </div>

  <div class="mb-3">
    <label class="form-label">性别</label>
    <input th:field="*{gender}" class="form-control"
           th:classappend="${#fields.hasErrors('gender')} ? ' is-invalid' : ''"/>
    <div class="invalid-feedback" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
  </div>

  <div class="mb-3">
    <label class="form-label">出生时间</label>
    <input type="datetime-local" th:field="*{dob}" class="form-control"
           th:classappend="${#fields.hasErrors('dob')} ? ' is-invalid' : ''"/>
    <div class="invalid-feedback" th:if="${#fields.hasErrors('dob')}" th:errors="*{dob}"></div>
    <div class="form-text">格式：YYYY-MM-DDTHH:mm，例如 2000-01-01T08:00</div>
  </div>

  <div class="mb-3">
    <label class="form-label">系号</label>
    <input th:field="*{deptId}" class="form-control" required
           th:classappend="${#fields.hasErrors('deptId')} ? ' is-invalid' : ''"/>
    <div class="invalid-feedback" th:if="${#fields.hasErrors('deptId')}" th:errors="*{deptId}"></div>
  </div>

  <div class="mb-3">
    <label class="form-label">职称</label>
    <input th:field="*{title}" class="form-control"
           th:classappend="${#fields.hasErrors('title')} ? ' is-invalid' : ''"/>
    <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
  </div>

  <div class="mb-3">
    <label class="form-label">专业</label>
    <input th:field="*{major}" class="form-control"
           th:classappend="${#fields.hasErrors('major')} ? ' is-invalid' : ''"/>
    <div class="invalid-feedback" th:if="${#fields.hasErrors('major')}" th:errors="*{major}"></div>
  </div>

  <button type="submit" class="btn btn-primary">保存</button>
  <a th:href="@{/staffs}" class="btn btn-secondary">取消</a>
</form>
</body>
</html>
