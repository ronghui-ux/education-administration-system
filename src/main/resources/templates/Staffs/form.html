<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>教职工表单</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container mt-4">
<h2 th:text="${staff != null && staff.staffId != null ? '编辑教职工' : '新增教职工'}">教职工表单</h2>
<form th:object="${staff}" th:action="@{/staffs}" method="post" class="row g-3">
  <div class="col-md-4">
    <label class="form-label">职工号</label>
    <input th:field="*{staffId}" class="form-control" required/>
  </div>
  <div class="col-md-4">
    <label class="form-label">姓名</label>
    <input th:field="*{name}" class="form-control" required/>
  </div>
  <div class="col-md-4">
    <label class="form-label">性别</label>
    <input th:field="*{gender}" class="form-control"/>
  </div>
  <div class="col-md-4">
    <label class="form-label">出生时间</label>
    <input th:field="*{dob}" type="datetime-local" class="form-control"/>
  </div>
  <div class="col-md-4">
    <label class="form-label">系号</label>
    <input th:field="*{deptId}" class="form-control" required/>
  </div>
  <div class="col-md-4">
    <label class="form-label">职称</label>
    <input th:field="*{title}" class="form-control"/>
  </div>
  <div class="col-md-12">
    <label class="form-label">专业</label>
    <input th:field="*{major}" class="form-control"/>
  </div>
  <div class="col-12 mt-2">
    <button class="btn btn-primary" type="submit">保存</button>
    <a th:href="@{/staffs}" class="btn btn-outline-secondary ms-2">返回</a>
  </div>
</form>
</body>
</html>
