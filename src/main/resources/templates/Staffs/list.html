<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>教职工信息列表</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container mt-4">
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>教职工信息列表</h2>
    <a th:href="@{/staffs/new}" class="btn btn-primary">新增教职工</a>
</div>

<form class="row g-2 mb-3" method="get" th:action="@{/staffs}">
    <div class="col-auto">
        <input name="q" th:value="${q}" class="form-control" placeholder="按职工号/姓名/系号搜索"/>
    </div>
    <div class="col-auto">
        <button type="submit" class="btn btn-outline-secondary">搜索</button>
    </div>
    <div class="col-auto">
        <a th:href="@{/staffs}" class="btn btn-outline-secondary">清空</a>
    </div>
</form>

<table class="table table-bordered table-hover">
    <thead class="table-light">
    <tr>
        <th>职工号</th>
        <th>姓名</th>
        <th>性别</th>
        <th>出生时间</th>
        <th>系号</th>
        <th>职称</th>
        <th>专业</th>
        <th style="width:160px;">操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="s : ${staffs}">
        <td th:text="${s.staffId}">T1001</td>
        <td th:text="${s.name}">张老师</td>
        <td th:text="${s.gender}">男</td>
        <td th:text="${#temporals.format(s.dob, 'yyyy-MM-dd HH:mm')}">2000-01-01 00:00</td>
        <td th:text="${s.deptId}">CS</td>
        <td th:text="${s.title}">副教授</td>
        <td th:text="${s.major}">软件工程</td>
        <td>
            <a th:href="@{|/staffs/${s.staffId}/edit|}" class="btn btn-sm btn-secondary">编辑</a>
            <form th:action="@{|/staffs/${s.staffId}/delete|}" method="post" class="d-inline"
                  onsubmit="return confirm('确认删除该教职工信息？');">
                <button type="submit" class="btn btn-sm btn-danger">删除</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
