<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>教职工管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container mt-4">
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>教职工管理</h2>
    <a th:href="@{/staffs/new}" class="btn btn-primary">新增教职工</a>
</div>

<form class="mb-3" method="get" th:action="@{/staffs}">
    <div class="input-group">
        <input class="form-control" name="q" th:value="${q}" placeholder="按职工号/姓名/系号搜索"/>
        <button class="btn btn-outline-secondary" type="submit">搜索</button>
        <a class="btn btn-outline-secondary" th:href="@{/staffs}">清空</a>
    </div>
</form>

<table class="table table-bordered table-hover">
    <thead class="table-light">
    <tr>
        <th>职工号</th><th>姓名</th><th>性别</th><th>出生时间</th><th>系号</th><th>职称</th><th>专业</th><th style="width:160px;">操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="s : ${staffs}">
        <td th:text="${s.staffId}">T001</td>
        <td th:text="${s.name}">张三</td>
        <td th:text="${s.gender}">男</td>
        <td th:text="${s.dob}">2024-01-01T12:00</td>
        <td th:text="${s.deptId}">CS01</td>
        <td th:text="${s.title}">副教授</td>
        <td th:text="${s.major}">软件工程</td>
        <td>
            <a class="btn btn-sm btn-primary" th:href="@{|/staffs/${s.staffId}/edit|}">编辑</a>
            <form th:action="@{|/staffs/${s.staffId}/delete|}" method="post" class="d-inline">
                <button class="btn btn-sm btn-outline-danger" onclick="return confirm('确认删除？')">删除</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
