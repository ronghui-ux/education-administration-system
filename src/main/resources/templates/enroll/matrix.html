<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>矩阵批量选课</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container mt-4">
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>矩阵批量选课（多个学生 × 多门课程）</h2>
    <div>
        <a th:href="@{/enroll/manage}" class="btn btn-outline-primary">返回选课批量管理</a>
        <a th:href="@{/enroll/browse}" class="btn btn-outline-secondary ms-2">按课程选课</a>
    </div>
</div>

<!-- 统一提示（摘要 + 失败详情） -->
<div th:replace="fragments/alerts :: globalAlerts"></div>

<form method="post" th:action="@{/enroll/matrix}">
    <div class="row g-3">
        <div class="col-md-3">
            <label class="form-label">学期</label>
            <input name="term" class="form-control" th:value="${term}" placeholder="2025-2026-1" required/>
        </div>
    </div>

    <div class="row g-3 mt-1">
        <div class="col-md-6">
            <label class="form-label">学生学号（可粘贴多行或逗号分隔）</label>
            <textarea name="studentIds" class="form-control" rows="8"
                      th:text="${studentIds} ?: ''" placeholder="S2023001&#10;S2023002,S2023003"></textarea>
        </div>
        <div class="col-md-6">
            <label class="form-label">课程号（可粘贴多行或逗号分隔）</label>
            <textarea name="courseIds" class="form-control" rows="8"
                      th:text="${courseIds} ?: ''" placeholder="C001&#10;C002,C003"></textarea>
        </div>
    </div>

    <div class="mt-3">
        <button type="submit" class="btn btn-primary">开始批量选课</button>
    </div>
</form>

<div class="mt-4" th:if="${results != null}">
    <table class="table table-bordered table-hover">
        <thead class="table-light">
        <tr>
            <th style="width:180px;">学号</th>
            <th style="width:120px;">课程号</th>
            <th style="width:120px;">结果</th>
            <th>信息</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${results}">
            <td th:text="${r.studentId}">S2023001</td>
            <td th:text="${r.courseId}">C001</td>
            <td>
          <span th:text="${r.success ? '成功' : '失败'}"
                th:classappend="${r.success ? ' text-success' : ' text-danger'}">成功</span>
            </td>
            <td th:text="${r.message}">OK</td>
        </tr>
        </tbody>
    </table>
    <div class="form-text">失败常见原因：学生已选过该课程、学分累计超过 15、课程或学生不存在。</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
