<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>选课批量管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container mt-4">
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>选课批量管理</h2>
    <div>
        <a th:href="@{/enroll/browse}" class="btn btn-outline-secondary">按课程选课</a>
        <a th:href="@{/enroll/matrix}" class="btn btn-outline-primary ms-2">矩阵批量选课</a>
    </div>
</div>

<!-- 统一提示（摘要 + 失败详情） -->
<div th:replace="fragments/alerts :: globalAlerts"></div>

<div class="row">
    <!-- 左侧：按学生 -->
    <div class="col-md-6">
        <div class="card mb-3">
            <div class="card-header">按学生查询与批量选课</div>
            <div class="card-body">
                <form method="get" th:action="@{/enroll/manage}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">学号</label>
                            <input name="studentId" th:value="${studentId}" class="form-control" placeholder="S2023001" required/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">学期</label>
                            <input name="term" th:value="${term}" class="form-control" placeholder="2025-2026-1" required/>
                        </div>
                    </div>
                    <div class="mt-2">
                        <button class="btn btn-outline-secondary" type="submit">查询</button>
                    </div>
                </form>

                <form class="mt-3" method="post" th:action="@{/enroll/manage/by-student}">
                    <input type="hidden" name="studentId" th:value="${studentId}"/>
                    <input type="hidden" name="term" th:value="${term}"/>
                    <label class="form-label mt-2">课程号列表（逗号/空格/换行分隔）</label>
                    <textarea name="courseIds" class="form-control" rows="4" placeholder="C001&#10;C002 C003"></textarea>
                    <button class="btn btn-primary mt-2" type="submit">批量为该学生选课</button>
                </form>

                <div class="mt-3" th:if="${byStudent != null}">
                    <h6>该学生该学期的选课记录</h6>
                    <table class="table table-sm table-bordered">
                        <thead class="table-light">
                        <tr><th>课程号</th><th>学期</th><th>状态</th><th style="width:200px;">操作</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="e : ${byStudent}">
                            <td th:text="${e.courseId}">C001</td>
                            <td th:text="${e.term}">2025-2026-1</td>
                            <td th:text="${e.status}">selected</td>
                            <td>
                                <form class="d-inline" th:action="@{/enroll/manage/delete}" method="post"
                                      onsubmit="return confirm('确认删除该选课记录？');">
                                    <input type="hidden" name="studentId" th:value="${e.studentId}"/>
                                    <input type="hidden" name="courseId" th:value="${e.courseId}"/>
                                    <input type="hidden" name="term" th:value="${e.term}"/>
                                    <button class="btn btn-sm btn-danger" type="submit">删除</button>
                                </form>
                                <form class="d-inline ms-1" th:action="@{/enroll/manage/status}" method="post">
                                    <input type="hidden" name="studentId" th:value="${e.studentId}"/>
                                    <input type="hidden" name="courseId" th:value="${e.courseId}"/>
                                    <input type="hidden" name="term" th:value="${e.term}"/>
                                    <select name="status" class="form-select form-select-sm d-inline w-auto">
                                        <option th:selected="${e.status == 'selected'}" value="selected">selected</option>
                                        <option th:selected="${e.status == 'dropped'}" value="dropped">dropped</option>
                                    </select>
                                    <button class="btn btn-sm btn-secondary ms-1" type="submit">更新</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 右侧：按课程 -->
    <div class="col-md-6">
        <div class="card mb-3">
            <div class="card-header">按课程查询与批量为课程选学生</div>
            <div class="card-body">
                <form method="get" th:action="@{/enroll/manage}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">课程号</label>
                            <input name="courseId" th:value="${courseId}" class="form-control" placeholder="C001" required/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">学期</label>
                            <input name="term" th:value="${term}" class="form-control" placeholder="2025-2026-1" required/>
                        </div>
                    </div>
                    <div class="mt-2">
                        <button class="btn btn-outline-secondary" type="submit">查询</button>
                    </div>
                </form>

                <form class="mt-3" method="post" th:action="@{/enroll/manage/by-course}">
                    <input type="hidden" name="courseId" th:value="${courseId}"/>
                    <input type="hidden" name="term" th:value="${term}"/>
                    <label class="form-label mt-2">学生学号列表（逗号/空格/换行分隔）</label>
                    <textarea name="studentIds" class="form-control" rows="4" placeholder="S2023001&#10;S2023002 S2023003"></textarea>
                    <button class="btn btn-primary mt-2" type="submit">批量为该课程选学生</button>
                </form>

                <div class="mt-3" th:if="${byCourse != null}">
                    <h6>该课程该学期的选课名单</h6>
                    <table class="table table-sm table-bordered">
                        <thead class="table-light">
                        <tr><th>学号</th><th>学期</th><th>状态</th><th style="width:200px;">操作</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="e : ${byCourse}">
                            <td th:text="${e.studentId}">S2023001</td>
                            <td th:text="${e.term}">2025-2026-1</td>
                            <td th:text="${e.status}">selected</td>
                            <td>
                                <form class="d-inline" th:action="@{/enroll/manage/delete}" method="post"
                                      onsubmit="return confirm('确认删除该选课记录？');">
                                    <input type="hidden" name="studentId" th:value="${e.studentId}"/>
                                    <input type="hidden" name="courseId" th:value="${e.courseId}"/>
                                    <input type="hidden" name="term" th:value="${e.term}"/>
                                    <button class="btn btn-sm btn-danger" type="submit">删除</button>
                                </form>
                                <form class="d-inline ms-1" th:action="@{/enroll/manage/status}" method="post">
                                    <input type="hidden" name="studentId" th:value="${e.studentId}"/>
                                    <input type="hidden" name="courseId" th:value="${e.courseId}"/>
                                    <input type="hidden" name="term" th:value="${e.term}"/>
                                    <select name="status" class="form-select form-select-sm d-inline w-auto">
                                        <option th:selected="${e.status == 'selected'}" value="selected">selected</option>
                                        <option th:selected="${e.status == 'dropped'}" value="dropped">dropped</option>
                                    </select>
                                    <button class="btn btn-sm btn-secondary ms-1" type="submit">更新</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>
</div>
</body>
</html>
