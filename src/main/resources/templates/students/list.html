<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>学生管理（查询 + 编辑 + 新增）</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container mt-4">
<!-- Determine the context based on the request URI -->
<div th:with="isManageContext=${#httpServletRequest.requestURI.contains('/students/manage')}">

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 th:text="${isManageContext} ? '学生管理' : '学生查询（按学号/姓名/系号）'">学生管理</h2>
    <div>
        <a th:if="${isManageContext}" th:href="@{/students/manage/new}" class="btn btn-primary">新生信息录入</a>
        <a th:if="${isManageContext}" th:href="@{/students/history}" class="btn btn-outline-secondary ms-2">学生历史（转学/毕业）</a>
        <a th:if="${!isManageContext}" th:href="@{/students}" class="btn btn-outline-secondary">清空</a>
        <a th:if="${!isManageContext}" th:href="@{/students/enrollments}" class="btn btn-outline-primary ms-2">查看选课与学分</a>
    </div>
</div>

<form class="row g-3 mb-3" method="get" th:action="${isManageContext} ? @{/students/manage} : @{/students}">
    <div class="col-md-3">
        <label class="form-label">学号</label>
        <input name="studentId" th:value="${studentId}" class="form-control" placeholder="S2023001"/>
    </div>
    <div class="col-md-3">
        <label class="form-label">姓名</label>
        <input name="name" th:value="${name}" class="form-control" placeholder="张三"/>
    </div>
    <div class="col-md-3">
        <label class="form-label">系号</label>
        <input name="deptId" th:value="${deptId}" class="form-control" placeholder="CS01"/>
    </div>
    <div class="col-md-3 d-flex align-items-end">
        <button type="submit" class="btn btn-outline-secondary" th:text="${isManageContext} ? '搜索' : '查询'">搜索</button>
        <a th:if="${isManageContext}" th:href="@{/students/manage}" class="btn btn-outline-secondary ms-2">清空</a>
    </div>
</form>

<div th:if="${!isManageContext}" class="mb-2">
    <span class="text-muted">共 <strong th:text="${resultCount}">0</strong> 条结果</span>
</div>

<table class="table table-bordered table-hover">
    <thead class="table-light">
    <tr>
        <th>学号</th>
        <th>姓名</th>
        <th>性别</th>
        <th>出生日期</th>
        <th th:text="${isManageContext} ? '高考成绩' : '入学成绩'">高考成绩</th>
        <th>系号</th>
        <th th:if="${isManageContext}" style="width:200px;">操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="s : ${students}">
        <td th:text="${s.studentId}">S2023001</td>
        <td th:text="${s.name}">张三</td>
        <td th:text="${s.gender}">男</td>
        <td th:text="${s.dob != null ? (isManageContext ? s.dob : #temporals.format(s.dob, 'yyyy-MM-dd')) : ''}">2005-09-01</td>
        <td th:text="${s.admissionScore}">620.00</td>
        <td th:text="${s.deptId}">CS01</td>
        <td th:if="${isManageContext}">
            <a class="btn btn-sm btn-primary" th:href="@{|/students/manage/${s.studentId}/edit|}">编辑</a>
            <form th:action="@{|/students/manage/${s.studentId}/delete|}" method="post" class="d-inline">
                <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('确定删除该学生？')">删除</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</div>
</body>
</html>
