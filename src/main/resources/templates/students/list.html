<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>学生查询（按学号/姓名/系号）</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container mt-4">
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>学生查询（按学号/姓名/系号）</h2>
    <div>
        <a th:href="@{/students}" class="btn btn-outline-secondary">清空</a>
        <a th:href="@{/students/enrollments}" class="btn btn-outline-primary ms-2">查看选课与学分</a>
    </div>
</div>

<form class="row g-3 mb-3" method="get" th:action="@{/students}">
    <div class="col-md-3">
        <label class="form-label">学号</label>
        <input name="studentId" th:value="${studentId}" class="form-control" placeholder="S2023001"/>
    </div>
    <div class="col-md-3">
        <label class="form-label">姓名</label>
        <input name="name" th:value="${name}" class="form-control" placeholder="张三"/>
    </div>
    <div class="col-md-3">
        <label class="form-label">系号</label>
        <input name="deptId" th:value="${deptId}" class="form-control" placeholder="CS"/>
    </div>
    <div class="col-md-3 d-flex align-items-end">
        <button type="submit" class="btn btn-primary">查询</button>
    </div>
</form>

<div class="mb-2">
    <span class="text-muted">共 <strong th:text="${resultCount}">0</strong> 条结果</span>
</div>

<table class="table table-bordered table-hover">
    <thead class="table-light">
    <tr>
        <th>学号</th>
        <th>姓名</th>
        <th>性别</th>
        <th>出生日期</th>
        <th>入学成绩</th>
        <th>系号</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="s : ${students}">
        <td th:text="${s.studentId}">S2023001</td>
        <td th:text="${s.name}">张三</td>
        <td th:text="${s.gender}">男</td>
        <td th:text="${#temporals.format(s.dob, 'yyyy-MM-dd')}">2003-09-01</td>
        <td th:text="${s.admissionScore}">85.50</td>
        <td th:text="${s.deptId}">CS</td>
    </tr>
    </tbody>
</table>
</body>
</html>
