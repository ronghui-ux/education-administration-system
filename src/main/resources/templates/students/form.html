<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>学生信息表单</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container mt-4">
<h2 th:text="${student != null && student.studentId != null ? '编辑学生信息' : '新生信息录入'}">学生信息表单</h2>

<form th:object="${student}" th:action="@{/students/manage}" method="post">
    <div class="row g-3">
        <div class="col-md-4">
            <label class="form-label">学号</label>
            <input th:field="*{studentId}" class="form-control"
                   th:classappend="${#fields.hasErrors('studentId')} ? ' is-invalid' : ''" placeholder="S2023001" required/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('studentId')}" th:errors="*{studentId}"></div>
        </div>
        <div class="col-md-4">
            <label class="form-label">姓名</label>
            <input th:field="*{name}" class="form-control"
                   th:classappend="${#fields.hasErrors('name')} ? ' is-invalid' : ''" placeholder="张三" required/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>
        <div class="col-md-4">
            <label class="form-label">性别</label>
            <input th:field="*{gender}" class="form-control" placeholder="男/女"/>
        </div>
    </div>

    <div class="row g-3 mt-1">
        <div class="col-md-4">
            <label class="form-label">出生日期</label>
            <input th:field="*{dob}" type="date" class="form-control"/>
        </div>
        <div class="col-md-4">
            <label class="form-label">高考成绩</label>
            <input th:field="*{admissionScore}" type="number" step="0.01" min="0" class="form-control"/>
            <div class="form-text">可留���。</div>
        </div>
        <div class="col-md-4">
            <label class="form-label">系号</label>
            <input th:field="*{deptId}" class="form-control" placeholder="CS01"/>
        </div>
    </div>

    <div class="mt-3">
        <button type="submit" class="btn btn-primary">保存</button>
        <a th:href="@{/students/manage}" class="btn btn-outline-secondary ms-2">返回列表</a>
        <a th:href="@{/students/history}" class="btn btn-outline-secondary ms-2">学生历史（转学/毕业）</a>
    </div>
</form>
</body>
</html>
