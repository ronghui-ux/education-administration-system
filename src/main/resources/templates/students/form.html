<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>学生表单</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container mt-4">
<h2 th:text="${student.studentId} != null ? '编辑学生' : '新增学生'">学生表单</h2>

<form th:object="${student}" th:action="@{/students}" method="post">
    <div class="mb-3">
        <label class="form-label">学号</label>
        <input th:field="*{studentId}"
               class="form-control"
               th:readonly="${student.studentId} != null" required/>
    </div>

    <div class="mb-3">
        <label class="form-label">姓名</label>
        <input th:field="*{name}"
               class="form-control"
               th:classappend="${#fields.hasErrors('name')} ? ' is-invalid' : ''" required/>
        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    </div>

    <div class="mb-3">
        <label class="form-label">性别</label>
        <input th:field="*{gender}" class="form-control"/>
    </div>

    <div class="mb-3">
        <label class="form-label">出生日期</label>
        <input th:field="*{dob}" class="form-control" type="date"/>
    </div>

    <div class="mb-3">
        <label class="form-label">入学成绩</label>
        <input th:field="*{admissionScore}" class="form-control" type="number" step="0.01"/>
        <div class="invalid-feedback" th:if="${#fields.hasErrors('admissionScore')}" th:errors="*{admissionScore}"></div>
    </div>

    <div class="mb-3">
        <label class="form-label">系号</label>
        <input th:field="*{deptId}" class="form-control"/>
    </div>

    <button type="submit" class="btn btn-primary">保存</button>
    <a th:href="@{/students}" class="btn btn-secondary">取消</a>
</form>
</body>
</html>
